#cloud-config
# Template variables:
# - root_password
# - search_list
# - hostname
# - ais_gateway (empty string when AIS is not enabled)
# - ais_destinations (list of CIDRs; empty list for none)

# Enable SSH password authentication.
ssh_pwauth: true

runcmd:
  - |
    set -eu

    # Set the root password before any network checks or early exits.
    echo "root:${root_password}" | chpasswd

    log() {
      printf '%s %s\n' "$(date +%T)" "$1" >> /var/log/cloud-init-runcmd.log
    }

    cd /etc/sysconfig/network-scripts

    if [ -f ifcfg-net0 ]; then
      log "ifcfg-net0 already exists; skipping network configuration"
      exit 0
    fi

    if [ ! -f ifcfg-eth0 ]; then
      log "Missing ifcfg-eth0; stopping"
      exit 1
    fi

    # Read the IPv4 address from eth0 only.
    CIDRS=$(ip -4 -o addr show dev eth0 scope global |
      awk '{print $4}')

    COUNT=$(printf '%s\n' "$CIDRS" |
      awk 'NF {n++} END {print n+0}')

    if [ "$COUNT" -ne 1 ]; then
      log "Expected exactly one global IPv4 address on eth0; stopping"
      exit 1
    fi

    IP=$(printf '%s\n' "$CIDRS" | cut -d/ -f1)
    PREFIX=$(printf '%s\n' "$CIDRS" | cut -d/ -f2)

    GW=$(ip -4 route show default dev eth0 |
      awk '{for (i=1; i<NF; i++) if ($i=="via") {print $(i+1); exit}}')

    MAC=$(cat /sys/class/net/eth0/address)

    log "DEVICE=eth0 IP=$IP PREFIX=$PREFIX GW=$GW MAC=$MAC"

    # Back up the original configuration outside this directory.
    BACKUP_DIR=$(mktemp -d /root/network-backup.XXXXXX)
    cp -p ifcfg-eth0 "$BACKUP_DIR/ifcfg-eth0"
    mv ifcfg-eth0 ifcfg-net0

    # Remove settings being replaced.
    # Existing DNS settings, UUID and unrelated options are preserved.
    sed -i -E '/^(IPADDR[0-9]*|PREFIX[0-9]*|NETMASK[0-9]*|GATEWAY[0-9]*|BOOTPROTO|DEVICE|HWADDR|NAME|ONBOOT|PROXY_METHOD|BROWSER_ONLY|DEFROUTE|IPV4_FAILURE_FATAL|IPV6_AUTOCONF|IPV6_DEFROUTE|IPV6_FAILURE_FATAL|RES_OPTIONS)=/d' ifcfg-net0

    {
      printf 'DEVICE=eth0\n'
      printf 'HWADDR=%s\n' "$MAC"
      printf 'NAME=net0\n'
      printf 'ONBOOT=yes\n'
      printf 'BOOTPROTO=none\n'
      printf 'IPADDR=%s\n' "$IP"
      printf 'PREFIX=%s\n' "$PREFIX"

      if [ -n "$GW" ]; then
        printf 'GATEWAY=%s\n' "$GW"
      fi

      printf 'PROXY_METHOD=none\n'
      printf 'BROWSER_ONLY=no\n'
      printf 'DEFROUTE=yes\n'
      printf 'IPV4_FAILURE_FATAL=no\n'
      printf 'IPV6_AUTOCONF=yes\n'
      printf 'IPV6_DEFROUTE=yes\n'
      printf 'IPV6_FAILURE_FATAL=no\n'
      printf 'RES_OPTIONS="timeout:2 attempts:1 rotate"\n'
    } >> ifcfg-net0

    # Set the DNS search list if provided.
    searchlist="${search_list}"

    if [ -n "$searchlist" ]; then
      log "Updating DOMAIN: $searchlist"
      sed -i '/^DOMAIN=/d' ifcfg-net0
      printf 'DOMAIN="%s"\n' "$searchlist" >> ifcfg-net0
    fi

    # Configure the optional persistent AIS host routes through eth1. An empty
    # gateway means AIS is not enabled, in which case the VSI has a single NIC
    # and there is nothing to do. With AIS enabled eth1 is expected to exist,
    # so its absence is an anomaly (typically eth1 not yet enumerated) and is
    # logged as a warning rather than passed over silently.
    AIS_GATEWAY="${ais_gateway}"
    AIS_UUID=$(nmcli -g GENERAL.CON-UUID device show eth1 2>/dev/null || true)

    if [ -z "$AIS_GATEWAY" ]; then
      log "AIS not enabled; single interface, no AIS routes to configure"
    elif [ ! -d /sys/class/net/eth1 ]; then
      log "WARNING: AIS enabled but eth1 is absent; no AIS routes configured"
    elif [ -z "$AIS_UUID" ] || [ "$AIS_UUID" = "--" ]; then
      log "WARNING: no active NetworkManager connection on eth1; no AIS routes configured"
    else
      # Keep the IPv4 default route on eth0.
      nmcli connection modify uuid "$AIS_UUID" \
        connection.autoconnect yes \
        ipv4.never-default yes

      # One nmcli call per destination, unrolled by Terraform at render time.
      # +ipv4.routes preserves routes already on the profile.
      %{ for dest in ais_destinations }
      nmcli connection modify uuid "$AIS_UUID" +ipv4.routes "${dest} $AIS_GATEWAY"
      log "AIS route added: ${dest} via $AIS_GATEWAY"
      %{ endfor }
      # Explicitly activate the saved profile.
      # If activation fails, log it and continue provisioning.
      if nmcli connection up uuid "$AIS_UUID" ifname eth1; then
        log "AIS routes activated on eth1"
      else
        log "WARNING: AIS routes saved, but eth1 activation failed; verify connectivity"
      fi
    fi

    # Update the hostname entry while preserving other hosts.
    cp -p /etc/hosts "$BACKUP_DIR/hosts"

    awk -v short="${hostname}" -v fqdn="${hostname}.fr.net.intra" '
      /^[[:space:]]*#/ {print; next}
      {
        drop=0
        for (i=2; i<=NF; i++) {
          if ($i ~ /^#/) break
          if ($i==short || $i==fqdn) drop=1
        }
        if (!drop) print
      }
    ' /etc/hosts > "$BACKUP_DIR/hosts.updated"

    printf '%s %s %s\n' \
      "$IP" \
      "${hostname}.fr.net.intra" \
      "${hostname}" >> "$BACKUP_DIR/hosts.updated"

    cat "$BACKUP_DIR/hosts.updated" > /etc/hosts

    # Restart NetworkManager after updating the configuration.
    log "Restarting NetworkManager; backups: $BACKUP_DIR"
    systemctl restart NetworkManager
